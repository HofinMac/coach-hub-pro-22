name: CI

# Runs on every push (including Lovable's commits to main) and on pull requests:
# typecheck, unit + database (RLS / notification) tests, production build.
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # `npm install` rather than `npm ci`: Lovable sometimes adds dependencies
      # without updating package-lock.json.
      - run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Tests (unit + database policies)
        run: npm test
      - name: Build
        run: npm run build
      # Lovable's commits trigger runs as its bot, so GitHub would not notify the
      # owner about a failure — open (or comment on) an issue instead.
      - name: Report failure on main
        if: failure() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body="CI selhalo na main u commitu ${GITHUB_SHA::7} (autor: ${{ github.actor }}). Log: $url"
          existing=$(gh issue list --state open --label ci-failure --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh label create ci-failure --color B60205 --description "Failing CI on main" 2>/dev/null || true
            gh issue create --title "CI na main selhává" --label ci-failure --body "$body"
          fi
